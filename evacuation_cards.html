<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>土砂災害・避難判断カード</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:650px;margin:0 auto;padding:22px;background:#f6f7f9;color:#17202b}h1{font-size:1.45rem}button{border:0;border-radius:10px;background:#1761a0;color:white;padding:14px 20px;font-size:1rem;cursor:pointer}article{padding:14px;margin:12px 0;background:white;border:1px solid #d9dfe5;border-radius:12px}summary{font-weight:700;cursor:pointer;padding:6px}p{line-height:1.7}.muted{color:#566; font-size:.93rem}</style></head><body><h1>土砂災害・避難判断ゲーム</h1><p>深夜に大雨が続き，土砂崩れの危険が高まっています．停電中で行政からの公式情報は届いていません．</p><p>10種類の情報から5枚を抽選します．A〜Eの各メンバーは自分のカードを確認し，情報を共有して避難するかどうかを判断してください．</p><button id="draw">5枚のカードを抽選する</button><div id="cards"></div><p class="muted">授業用の架空の情報です．実際の災害時の避難判断には使用しないでください．</p><script>const data=["近くの斜面から，普段は見られない濁った水が流れ出している．","停電前に確認した天気予報では，雨はあと1時間ほどで弱まる見込みだった．","近所の住民が『山の方からゴロゴロという異常な音がした』と話している．","この地区には，30年以上，大きな土砂災害が発生した記録がない．","指定避難所までは徒歩約20分．途中に小さな川を渡る橋がある．","地域のSNSに『近くで土砂崩れが発生したらしい』という投稿があった．場所や投稿者は不明．","自宅の裏山に面した道路で，新しい亀裂を見つけた住民がいる．","自治会長は『この程度の雨は以前にもあった．今すぐ避難する必要はない』と話している．","近所には歩行が困難な高齢者がおり，避難には他の住民の介助が必要である．","直近30分で雨がさらに強くなり，周辺の道路にも水がたまり始めている．"];document.getElementById('draw').onclick=()=>{let a=data.map((_,i)=>i);for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}document.getElementById('cards').innerHTML=a.slice(0,5).map((id,i)=>`<article><details><summary>情報カード ${'ABCDE'[i]} （タップして開く）</summary><p>${data[id]}</p></details></article>`).join('')};</script></body></html>
